<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="200" y1="80" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4d61f4" />
      <stop offset="1" stop-color="#ef2987" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <g filter="url(#shadow)">
    <rect x="180" y="180" width="520" height="520" rx="42" fill="#fefefe" fill-opacity="0.12" />
  </g>
  <text x="260" y="360" font-family="Poppins, Arial, sans-serif" font-size="80" font-weight="800" fill="#ffffff" fill-opacity="0.92">
    Drop your
  </text>
  <text x="260" y="450" font-family="Poppins, Arial, sans-serif" font-size="80" font-weight="800" fill="#ffd233" fill-opacity="0.92">
    hero image
  </text>
  <text x="260" y="540" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" fill-opacity="0.8">
    Replace /public/assets/dummy-hero.svg with your artwork.
  </text>
  <filter id="shadow" x="160" y="160" width="560" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0d0d0d" flood-opacity="0.22" />
  </filter>
</svg>
